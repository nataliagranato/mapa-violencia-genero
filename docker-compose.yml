services:
  # Migração: aplica data/schema.sql + data/seed_fontes_mg.sql (idempotente).
  # Roda a cada `up` e sai; o backend só sobe depois que termina com sucesso.
  migrate:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
    command: ["python", "scripts/init_db.py"]
    restart: "no"

  # Ingestão sob demanda: docker compose run --rm ingest
  # (baixa ~133 MB de CSVs + malha do IBGE — não roda no `up`)
  ingest:
    profiles: ["ingest"]
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
      - ./frontend/public:/app/frontend/public
    command: ["sh", "-c", "python scripts/sync_ibge_mg.py && python scripts/sync_sejusp_mg.py"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mapa-mg-backend
    environment:
      - ADDR=:8080
      - DB_PATH=/data/violencia_mg.db
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 128m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mapa-mg-frontend
    environment:
      - VITE_API_TARGET=http://backend:8080
    volumes:
      - ./frontend/public:/app/public:ro
      # código-fonte montado: HMR no container, sem rebuild a cada edição
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html:ro
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 256m
